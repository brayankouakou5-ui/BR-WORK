
name: Build BR WORK APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Extraire BR WORK
        run: |
          unzip -q BR_WORK_source_v1_cloud_build.zip -d project

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dependances
        working-directory: project/BR_WORK
        run: npm install

      - name: Creer le projet Android
        working-directory: project/BR_WORK
        run: npx cap add android

      - name: Synchroniser Android
        working-directory: project/BR_WORK
        run: npx cap sync android

      - name: Generer APK
        working-directory: project/BR_WORK/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: BR-WORK-APK
          path: project/BR_WORK/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
